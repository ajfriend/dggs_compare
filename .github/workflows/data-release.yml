# Generate the full data artifact from scratch and publish it as a GitHub
# data release — the canonical producer (native linux; dggal's wheels are
# correct there, no Rosetta anywhere). Trigger:
#
#   gh workflow run data-release.yml -f tag=data-vN
#
# Cut a new tag when the INPUTS change (seed/budgets, grid set, calibration,
# solver bump worth reflecting) — decoupled from code releases.
#
# Fan-out/fan-in: one runner per DGGS builds that system's tables (keep the
# matrix in sync with src/dggs_compare/systems/), and the publish job merges
# the artifacts, gates on the DNC invariants, derives the viewer data
# (including the full-globe page's complete-coverage binaries — those
# resolutions live exhaustively in the ivea7h tables), and uploads.
name: data-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Data release tag (e.g. data-v1)'
        required: true
        type: string
      # One runner type for EVERY job in a release, so a data artifact never
      # mixes float provenance across architectures. ubuntu-latest (x86_64)
      # is the verified default; ubuntu-24.04-arm is the experiment — the
      # aarch64 dggal/a5_fast wheels exist but are unverified (the dnc-check
      # gate + a table spot-diff against an x86 release is the validation).
      runner:
        description: 'Runner type for all jobs'
        required: false
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04-arm

permissions:
  contents: write

jobs:
  gen:
    strategy:
      matrix:
        system: [a5, h3, isea7h, ivea7h, rhealpix, s2]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          # No cross-run cache: skar builds from source with zig ReleaseFast
          # tuned to the build machine CPU, and hosted runners are a
          # heterogeneous fleet — a wheel cached on one microarch can SIGILL
          # on the next (exit 132; see skar_py issue on baseline targeting).
          enable-cache: false
      - uses: extractions/setup-just@v4
      - run: just sync
      - run: just gen ${{ matrix.system }}
      - uses: actions/upload-artifact@v6
        with:
          name: tables-${{ matrix.system }}
          path: data/cells/
          if-no-files-found: error

  publish:
    needs: [gen]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          # No cross-run cache: skar builds from source with zig ReleaseFast
          # tuned to the build machine CPU, and hosted runners are a
          # heterogeneous fleet — a wheel cached on one microarch can SIGILL
          # on the next (exit 132; see skar_py issue on baseline targeting).
          enable-cache: false
      - uses: extractions/setup-just@v4
      - run: just sync
      - uses: actions/download-artifact@v6
        with:
          pattern: tables-*
          path: data/cells/
          merge-multiple: true
      - name: gate — DNC invariants must hold before anything ships
        run: just dnc-check
      - name: derive the web viewer data
        run: just web-data
      - name: stage + publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          just data-pack
          just data-publish '${{ inputs.tag }}'
