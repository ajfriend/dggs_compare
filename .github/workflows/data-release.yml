# Generate the full data artifact from scratch and publish it as a GitHub
# data release — the canonical producer (native linux; dggal's wheels are
# correct there, no Rosetta anywhere). Trigger:
#
#   gh workflow run data-release.yml -f tag=data-vN
#
# Cut a new tag when the INPUTS change (seed/budgets, grid set, calibration,
# solver bump worth reflecting) — decoupled from code releases.
#
# One build job per IMPLEMENTATION — the matrix is the scripts/systems/
# listing, so it can never go stale — running the two pipeline stages
# back to back in two SEPARATE envs on the same runner:
#
#   stage 1  `just gen <key>`: raw cell geometry, in the script's own
#            PEP 723 env (binding + library, nothing else)
#   stage 2  `just metrics`: solve + convergence admission gate, in the
#            project env (solvers, no bindings) — reads only the raw
#            parquet stage 1 wrote
#
# Same-runner keeps the fan-out fully parallel (no barrier, no 16GB raw
# round-trip) without weakening provenance: csar/sparea install as fixed
# PyPI wheels, so every runner executes identical solver binaries. The
# publish job merges the finals, applies the release gates, derives the
# viewer data, and uploads.
name: data-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Data release tag (e.g. data-v1)'
        required: true
        type: string
      # One runner type for EVERY job in a release, so a data artifact never
      # mixes float provenance across architectures. ubuntu-latest (x86_64)
      # is the verified default; ubuntu-24.04-arm is the experiment — the
      # aarch64 wheels exist but are unverified (the dnc-check gate + a
      # table spot-diff against an x86 release is the validation).
      runner:
        description: 'Runner type for all jobs'
        required: false
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04-arm

permissions:
  contents: write

jobs:
  systems:
    # The build matrix IS the registry: `just systems` is the one shell
    # reading of the scripts/systems/ listing ({grid}-{impl}.py per
    # implementation).
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    outputs:
      list: ${{ steps.ls.outputs.list }}
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - id: ls
        run: |
          echo "list=$(just systems | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  build:
    needs: [systems]
    strategy:
      # One broken implementation must not cancel the other nine: with
      # fail-fast off, healthy jobs finish and `gh run rerun --failed`
      # reuses their artifacts, so a fix only reruns the one red job.
      fail-fast: false
      matrix:
        key: ${{ fromJSON(needs.systems.outputs.list) }}
    runs-on: ${{ inputs.runner }}
    # The aperture-3 grids are the longest chains (~34 resolutions
    # generated, then solved), ~40 min each verified.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      # Caching is safe (every dependency ships linux wheels — nothing
      # builds from source in CI) and keyed per implementation: matrix
      # jobs sharing one key would race to save it, and the winner's
      # cache would hold only its own binding wheels.
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-suffix: ${{ matrix.key }}
      - uses: extractions/setup-just@v4
      # DGGRID-backed implementations (detected from the script source, so
      # no hand-maintained list) need the dggrid binary built into .tools/.
      - name: install dggrid if this implementation needs it
        run: |
          if grep -q dggrid_engine "scripts/systems/${{ matrix.key }}.py"; then
            just install-dggrid
          fi
      # Stage 1 (see header): no `just sync` — the script resolves its
      # own env from its PEP 723 header.
      - name: generate raw cell geometry
        run: just gen ${{ matrix.key }}
      # Stage 2 (see header): the explicit sync makes env resolution its
      # own failure point, distinct from a red solve.
      - name: metrics — solve + convergence admission gate
        run: |
          just sync
          just metrics
      # zstd parquet doesn't re-compress, and the finals are duplicated
      # into the release minutes later — short retention, no zip effort.
      - uses: actions/upload-artifact@v6
        with:
          name: tables-${{ matrix.key }}
          path: data/cells/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      # The raw geometry is reproducible from the pinned envs, so the
      # happy path uploads nothing; a red job preserves it for debugging
      # without regenerating.
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: raw-${{ matrix.key }}
          path: data/raw/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

  publish:
    needs: [build]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      # No cache-suffix: the default key is already distinct from the
      # suffixed build caches.
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: extractions/setup-just@v4
      - run: just sync
      - uses: actions/download-artifact@v6
        with:
          pattern: tables-*
          path: data/cells/
          merge-multiple: true
      - name: gate — coverage + DNC invariants must hold before anything ships
        run: just dnc-check
      - name: derive the web viewer data
        run: just web-data
      - name: stage + publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          just data-pack
          just data-publish '${{ inputs.tag }}'
