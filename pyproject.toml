[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dggs_compare"
version = "0.1.0"
description = "Comparing DGGS grids (H3, S2, A5, ISEA7H, IVEA7H, rHEALPix) by per-cell shape and area stats, via skar + sparea."
readme = "readme.md"
# a5_fast has no cp314 wheels yet (Rust sdist otherwise), so dev/CI pin 3.13.
requires-python = ">=3.11,<3.14"
# The internal library + everything the pipeline touches, ONE env. dggal
# 0.0.6's macOS arm64 wheel still bundles x86_64 dylibs, so on Apple Silicon
# that env runs x86_64 under Rosetta (`just sync`); Linux is native. The
# registry imports system modules on first use, so `import dggs_compare` and
# the table-reading consumers never load a DGGS binding.
dependencies = [
    "numpy>=1.24",
    "pyarrow>=15",
    "matplotlib>=3",
    "skar",
    "sparea>=0.4",
    "h3>=4",
    "s2sphere",
    "a5_fast",
    "dggal>=0.0.6",
]

[dependency-groups]
lab = ["jupyterlab>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/dggs_compare"]

[tool.uv.sources]
# skar isn't on PyPI yet; pin the released tag (uv builds it from source —
# the zig/meson toolchain arrives via build isolation). Bump on skar releases;
# point at a branch/rev to run the pre-release regression gate.
skar = { git = "https://github.com/ajfriend/skar_py", tag = "v0.6.0" }
