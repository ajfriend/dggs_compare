[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dggs_compare"
version = "0.1.0"
description = "Comparing DGGS grids by per-cell shape and area stats, via csar + sparea."
readme = "readme.md"
# a5_fast has no cp314 wheels yet (Rust sdist otherwise), so dev/CI pin 3.13.
requires-python = ">=3.11,<3.14"
# The library + the solvers and plotting the pipeline scripts use. No DGGS
# bindings here: those live in each implementation script's PEP 723 header
# (scripts/systems/), resolved into per-script envs that never co-resolve
# with each other. csar from PyPI since 0.1.1 (no macOS x86_64 wheels, so
# the Rosetta env builds the sdist — zig/meson arrive via build isolation);
# for the csar pre-release regression gate, point a [tool.uv.sources] entry
# at a csar_py branch/rev.
dependencies = [
    "numpy>=2",
    "pyarrow>=15",
    "matplotlib>=3",
    "csar>=0.1.1",
    "sparea>=0.4",
]

[dependency-groups]
lab = ["jupyterlab>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/dggs_compare"]
